<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Настройки CopyAll</title>
  <link rel="stylesheet" href="style.css">
  <script src="thodhub.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Настройки CopyAll</h1>
    <section aria-labelledby="context-heading">
      <h2 id="context-heading">Контекстное меню</h2>
      <p id="context-state"></p>
      <div class="actions">
        <button id="context-install" class="primary" disabled>Добавить в контекстное меню</button>
        <button id="context-remove" disabled>Удалить из контекстного меню</button>
      </div>
    </section>
    <section aria-labelledby="startup-heading">
      <h2 id="startup-heading">Автозапуск</h2>
      <p id="startup-state"></p>
      <div class="actions">
        <button id="startup-install" class="primary" disabled>Добавить в автозапуск</button>
        <button id="startup-remove" disabled>Убрать из автозапуска</button>
      </div>
    </section>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
