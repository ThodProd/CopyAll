name: CopyAll Rust build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: rustup default stable-x86_64-pc-windows-msvc
      - shell: pwsh
        run: cargo fmt --all --check
      - shell: pwsh
        run: cargo build --workspace --locked --release
